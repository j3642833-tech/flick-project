<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Followers</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:0;}
    body{background:#f3f4f7;color:#111}
    .topbar{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #e6e6e6;background:#fff;position:sticky;top:0;z-index:40}
    .topbar .back{font-size:20px;cursor:pointer}
    .topbar h1{flex:1;text-align:center;font-size:18px;margin:0}
    .container{padding:14px}
    .info{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px;border:1px solid #eee}
    .searchWrap{display:flex;gap:8px;align-items:center;margin:12px 0}
    .search{flex:1;padding:10px;border-radius:10px;border:1px solid #e6e6e6;background:#fff}
    .list{display:flex;flex-direction:column;gap:12px}
    .follow-card{background:#fff;padding:12px;border-radius:12px;display:flex;gap:12px;align-items:center;border:1px solid #eee}
    .avatar{width:56px;height:56px;border-radius:50%;background:#dfefff;flex:0 0 56px;object-fit:cover}
    .meta{flex:1}
    .name{font-weight:700}
    .sub{color:#777;font-size:13px;margin-top:6px}
    .actions{display:flex;gap:8px;align-items:center}
    .btn{padding:8px 10px;border-radius:10px;border:none;cursor:pointer}
    .btn.view{background:#fff;border:1px solid #ddd}
    .btn.remove{background:#111;color:#fff}
    .empty{padding:28px;text-align:center;color:#777;background:#fff;border-radius:12px;border:1px solid #eee}
    .inline{color:#111;text-decoration:none;font-weight:600}
    @media(min-width:720px){ .container{max-width:720px;margin:0 auto} }
    /* popup menu style reused */
    .menu-btn{border:none;background:none;font-size:18px;cursor:pointer}
    .popup{position:absolute;right:12px;top:56px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px 0;z-index:999;width:160px;box-shadow:0 6px 18px rgba(0,0,0,0.12)}
    .popup button{width:100%;padding:10px;text-align:left;border:none;background:transparent;cursor:pointer;font-size:14px}
    .popup button:hover{background:#f3f3f3}
  </style>
</head>
<body>

  <div class="topbar">
    <div class="back" id="backBtn"><i class="fa-solid fa-arrow-left"></i></div>
    <h1>Followers</h1>
    <div style="width:28px"></div>
  </div>

  <div class="container">
    <div class="info">
      <div style="font-weight:700">People who follow you</div>
      <div style="color:#666;margin-top:6px;font-size:13px">
        Manage followers. Click <span class="inline" id="goProfile">Profile</span> to return.
      </div>
    </div>

    <div class="searchWrap">
      <input id="searchInput" class="search" placeholder="Search followers..." />
      <button id="refreshBtn" class="btn" title="Refresh"><i class="fa-solid fa-arrows-rotate"></i></button>
    </div>

    <div id="list" class="list"></div>

    <div id="emptyMsg" class="empty" style="display:none">No one is following you yet.</div>
  </div>

<script>
/* Followers page (mock-first) */
/* Data stored in localStorage key so it persists across reloads if you want */
(function(){
  const STORAGE_KEY = 'flick_followers_v1';
  const DEFAULT = [
    { id:'f1', name:'Samira', handle:'@samira', avatar:'https://via.placeholder.com/150/ffd1dc/333?text=S', bio:'Artist • Traveler' },
    { id:'f2', name:'Dev',    handle:'@devcodes', avatar:'https://via.placeholder.com/150/d1f7ff/333?text=D', bio:'Developer' },
    { id:'f3', name:'Rita',   handle:'@rita', avatar:'https://via.placeholder.com/150/cdd1ff/333?text=R', bio:'Gamer & creator' }
  ];

  const $ = (q,root=document) => root.querySelector(q);
  const load = ()=> {
    try{ const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : DEFAULT.slice(); }
    catch(e){ return DEFAULT.slice(); }
  };
  const save = (arr)=> { try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(e){} };

  let items = load();

  const listEl = $('#list');
  const emptyEl = $('#emptyMsg');

  function render(filter=''){
    listEl.innerHTML = '';
    const f = (filter||'').trim().toLowerCase();
    const show = items.filter(u=>{
      if(!f) return true;
      return (u.name + ' ' + (u.handle||'') + ' ' + (u.bio||'')).toLowerCase().includes(f);
    });

    if(show.length === 0){
      emptyEl.style.display = 'block';
      return;
    } else {
      emptyEl.style.display = 'none';
    }

    show.forEach(u=>{
      const card = document.createElement('div');
      card.className = 'follow-card';
      card.dataset.id = u.id;
      card.innerHTML = `
        <img class="avatar" src="${escapeHtml(u.avatar||'')}" alt="${escapeHtml(u.name)}" onerror="this.style.background='#dfefff'">
        <div class="meta">
          <div class="name">${escapeHtml(u.name)} <span style="color:#777;font-weight:500;font-size:13px">${escapeHtml(u.handle||'')}</span></div>
          <div class="sub">${escapeHtml(u.bio||'')}</div>
        </div>
        <div class="actions">
          <button class="btn view" data-id="${u.id}">View</button>
          <button class="btn remove" data-id="${u.id}">Remove</button>
          <button class="menu-btn" title="Menu"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
      `;
      listEl.appendChild(card);

      // attach menu button
      const menuBtn = card.querySelector('.menu-btn');
      menuBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        closeAllMenus();
        showMenu(card, u);
      });
    });
  }

  function escapeHtml(s){ return (s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

  // menu
  function showMenu(card, user){
    const menu = document.createElement('div');
    menu.className = 'popup';
    menu.innerHTML = `
      <button onclick="viewProfile('${user.id}')">View profile</button>
      <button onclick="messageUser('${user.id}')">Message</button>
      <button onclick="blockUser('${user.id}')">Block</button>
      <button onclick="removeFollower('${user.id}')">Remove follower</button>
      <button onclick="reportUser('${user.id}')">Report</button>
    `;
    card.appendChild(menu);
    document.addEventListener('click', closeAllMenus);
  }
  function closeAllMenus(){ document.querySelectorAll('.popup').forEach(p=>p.remove()); }

  // actions
  window.removeFollower = function(id){
    if(!confirm('Remove this follower?')) return;
    items = items.filter(x=> x.id !== id);
    save(items);
    render($('#searchInput').value);
    toast('Follower removed');
    closeAllMenus();
  };
  window.blockUser = function(id){
    closeAllMenus();
    toast('Blocked (UI only)');
  };
  window.messageUser = function(id){
    closeAllMenus();
    alert('Message screen coming later');
  };
  window.viewProfile = function(id){
    closeAllMenus();
    // go to profile page and pass id in hash
    window.location.href = 'profile.html#' + encodeURIComponent(id);
  };
  window.reportUser = function(id){
    closeAllMenus();
    alert('Report sent');
  };

  // search + refresh
  $('#searchInput').addEventListener('input', (e)=> render(e.target.value));
  $('#refreshBtn').addEventListener('click', ()=> { items = load(); render($('#searchInput').value); toast('Refreshed'); });

  // view/remove quick buttons (delegated)
  listEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    if(btn.classList.contains('view')){
      const id = btn.dataset.id; viewProfile(id); return;
    }
    if(btn.classList.contains('remove')){
      const id = btn.dataset.id; removeFollower(id); return;
    }
  });

  // back / profile link
  $('#backBtn').addEventListener('click', ()=> window.history.back());
  $('#goProfile').addEventListener('click', ()=> window.location.href = 'profile.html');

  function toast(msg, t=1200){
    const el = document.createElement('div');
    el.textContent = msg;
    Object.assign(el.style,{position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:'22px',background:'#111',color:'#fff',padding:'8px 12px',borderRadius:'8px',zIndex:99999});
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),t);
  }

  // expose debug helpers
  window.__FOLLOWERS = {
    get: ()=> items.slice(),
    add: u => { items.unshift(u); save(items); render($('#searchInput').value); },
    reset: ()=> { items = DEFAULT.slice(); save(items); render(); }
  };

  // initial render
  render();
})();
</script>

</body>
</html>
